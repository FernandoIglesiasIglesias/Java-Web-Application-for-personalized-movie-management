# Nombre de la aplicación
spring.application.name=tfg

# Configuración de base de datos H2 persistente
spring.datasource.url=jdbc:h2:file:./data/mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Inicialización de SQL
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Configuración de consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Configuración de DevTools
spring.devtools.restart.trigger-file=reload
spring.devtools.livereload.enabled=false

# Configuración de Jackson
spring.jackson.default-property-inclusion=NON_NULL

# Configuración de logging
logging.level.org.hibernate.SQL=debug

# Configuración del servidor
server.servlet.context-path=/tfg

